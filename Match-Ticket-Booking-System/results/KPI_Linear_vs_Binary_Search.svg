<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#181a2d"/><text x="600" y="48" text-anchor="middle" fill="#e7e8f2" font-family="Arial" font-size="28" font-weight="700">Linear Search vs Binary Search</text><text x="600" y="80" text-anchor="middle" fill="#a6a7bd" font-family="Arial" font-size="17">Fan lookup execution time per lookup (ms)</text><g stroke="#343750" stroke-width="1"><path d="M120 520H1130M120 430H1130M120 340H1130M120 250H1130M120 160H1130"/></g><g fill="#bfc0d3" font-family="Arial" font-size="15"><text x="110" y="548">n=50</text><text x="300" y="548">n=100</text><text x="485" y="548">n=250</text><text x="680" y="548">n=500</text><text x="860" y="548">n=1000</text><text x="1050" y="548">n=2000</text></g><polyline points="145,516 330,505 515,490 700,455 885,395 1070,245" fill="none" stroke="#f05b5b" stroke-width="5" stroke-dasharray="14 10"/><polyline points="145,516 330,514 515,512 700,507 885,504 1070,501" fill="none" stroke="#8581f2" stroke-width="5"/><g fill="#f05b5b"><circle cx="145" cy="516" r="8"/><circle cx="330" cy="505" r="8"/><circle cx="515" cy="490" r="8"/><circle cx="700" cy="455" r="8"/><circle cx="885" cy="395" r="8"/><circle cx="1070" cy="245" r="8"/></g><g fill="#8581f2"><circle cx="145" cy="516" r="8"/><circle cx="330" cy="514" r="8"/><circle cx="515" cy="512" r="8"/><circle cx="700" cy="507" r="8"/><circle cx="885" cy="504" r="8"/><circle cx="1070" cy="501" r="8"/></g><text x="600" y="585" text-anchor="middle" fill="#8f90a8" font-family="Arial" font-size="15">Binary Search requires sorted input — O(log n) vs Linear Search O(n)</text></svg>
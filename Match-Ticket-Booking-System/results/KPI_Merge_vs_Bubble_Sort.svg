<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#181a2d"/><text x="600" y="48" text-anchor="middle" fill="#e7e8f2" font-family="Arial" font-size="28" font-weight="700">Merge Sort vs Bubble Sort</text><text x="600" y="80" text-anchor="middle" fill="#a6a7bd" font-family="Arial" font-size="17">Attendance sorting execution time (ms)</text><g stroke="#343750" stroke-width="1"><path d="M120 520H1130M120 430H1130M120 340H1130M120 250H1130M120 160H1130"/></g><g fill="#bfc0d3" font-family="Arial" font-size="15"><text x="150" y="548">n=50</text><text x="330" y="548">n=100</text><text x="510" y="548">n=200</text><text x="690" y="548">n=300</text><text x="870" y="548">n=400</text><text x="1040" y="548">n=500</text></g><polyline points="160,515 340,505 520,487 700,455 880,405 1060,350" fill="none" stroke="#8581f2" stroke-width="5"/><polyline points="160,510 340,480 520,410 700,300 880,190 1060,115" fill="none" stroke="#f05b5b" stroke-width="5" stroke-dasharray="14 10"/><text x="600" y="585" text-anchor="middle" fill="#8f90a8" font-family="Arial" font-size="15">Merge Sort O(n log n) scales substantially better than Bubble Sort O(n²)</text></svg>